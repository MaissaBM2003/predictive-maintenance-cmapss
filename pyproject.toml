[project]
name = "predictive-maintenance-cmapss"
version = "0.1.0"
description = ""
authors = [
    {name = "MalakLH",email = "maissa.benmrad@supcom.tn"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "numpy (>=2.2,<3.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "mlflow (>=3.16.1,<4.0.0)",
    "dvc (>=3.67.1,<4.0.0)",
    "pandera (>=0.33.1,<0.34.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "torch (>=2.14.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
[tool.pytest.ini_options]
pythonpath = ["."]